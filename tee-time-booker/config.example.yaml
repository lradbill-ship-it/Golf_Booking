# ---------------------------------------------------------------------------
# tee-time-booker configuration
#
# Copy this file to "config.yaml" and adjust for your club's portal.
# config.yaml is gitignored (it may contain a club-specific URL you'd rather
# not publish). Credentials do NOT go here — they live in .env.
#
# The CSS selectors below are the part that is specific to YOUR club's booking
# portal. The defaults are placeholders. Fill them in by opening your portal in
# a browser, right-clicking the relevant field, and choosing "Inspect", or by
# running:  python book.py inspect   (opens a browser so you can capture them).
# ---------------------------------------------------------------------------

club:
  # The page that shows the username/password login form.
  login_url: "https://your-club-portal.example.com/login"

  # The tee-sheet / booking page. {date} is substituted with the play date.
  # Many portals accept the date in the URL; if yours uses a date picker
  # instead, leave the {date} token out and configure date_picker below.
  tee_sheet_url: "https://your-club-portal.example.com/teesheet?date={date}"

  # strftime format used to render {date} above (e.g. 2026-07-07).
  date_url_format: "%Y-%m-%d"

# When are tee times released? The booker computes the exact release moment as:
#   (play_date - days_ahead) at release_time, in the given timezone,
# and fires at that instant.
release:
  days_ahead: 14          # times open 2 weeks out
  release_time: "00:01"   # 12:01 AM
  timezone: "America/New_York"  # handles EST/EDT automatically
  # How early (seconds) to wake up and be ready before the release instant.
  warmup_seconds: 30
  # Log in this many seconds before the release, so authentication finishes
  # before the high-traffic release moment (logging in at the peak can fail).
  prelogin_seconds: 60
  # Keep checking this long after the start — large enough to cover a release
  # that lands a little after the nominal time (it waits for the fresh sheet).
  # Make sure the machine stays awake for the whole window.
  retry_window_seconds: 1800
  # Base seconds between checks (jittered +0-60% in code). Keep it gentle for
  # long windows; the booker also blocks images/fonts/analytics and backs off
  # on rate-limit blocks to stay under Cloudflare's limiter.
  retry_interval_seconds: 15.0
  # If the machine has no internet at login time (e.g. Wi-Fi hasn't reconnected
  # at midnight), keep retrying the login this many seconds before giving up —
  # there's usually slack before the sheet actually releases. 0 disables it.
  login_retry_seconds: 300
  login_retry_interval_seconds: 10.0

# What you want to book.
booking:
  # Preferred play date — overridden by the --date CLI flag if given.
  # Format: YYYY-MM-DD. Leave blank to require --date on the command line.
  date: ""
  # Ordered list of acceptable start times. The booker grabs the first one
  # that is available, trying them top to bottom.
  #
  # The FIRST entry is also your target: once none of these is bookable, the
  # fallback below measures "closest" from that time. Put the time you actually
  # want first.
  preferred_times:
    - "08:00 AM"
    - "08:10 AM"
    - "08:20 AM"
    - "07:50 AM"
  players: 4

  # What to do when NONE of preferred_times is bookable. Tee sheets move with
  # sunrise — a 6:30 AM slot that exists in June simply stops being published in
  # late August — so without this the booker would book nothing on exactly the
  # nights the early times shifted. With it, it takes the bookable slot closest
  # to what you asked for (the earlier one wins a tie), which in the sunrise
  # case is just "the earliest time on the sheet".
  fallback:
    enabled: true
    # How far from your TARGET (the first entry in preferred_times) a fallback
    # may sit, going back and going forward respectively.
    #
    # max_minutes_later: null is the always-book rule — take the nearest
    # available time however late it lands, on the view that an afternoon round
    # beats no round. This is the default. Put a number here instead (e.g. 120)
    # if you would rather come away with nothing than play hours off target.
    # Either side accepts null for "no bound"; 0 means no slack at all.
    max_minutes_earlier: 60
    max_minutes_later: null
    # Hold the fallback back this many seconds into the polling window, to give
    # your preferred times a head start. 0 = consider it as soon as the sheet
    # is up (recommended: if the time doesn't exist, waiting only loses ground).
    after_seconds: 0
    # Before settling for second best, pause this long and re-scan the
    # preferred times once — cheap insurance against a half-rendered sheet.
    recheck_seconds: 3

# Earlier-time watcher (watch_earlier.py) — READ-ONLY, never books or cancels.
# Some mornings are gone within seconds of release (PCC's Tuesday sheet is empty
# from the first tee until 9:40 AM), so the nightly fallback lands hours late.
# The watcher re-checks those dates during the day and flags an EARLIER time on
# the dashboard if one opens. It only watches times the nightly booker booked
# (not ones you booked by hand) that sit later than that day's target.
# Every key is optional; these are the defaults.
earlier_watch:
  # Flag only a real gain: the open time must be at least this many minutes
  # closer to the day's target. Slots are 10 min apart, so 10 = any better slot.
  min_improvement_minutes: 10
  # Don't watch dates sooner than this many days away.
  min_days_ahead: 1
  # Never run in this local-time window, so it can't log in during the midnight
  # race. Wraps past midnight.
  quiet_start: "23:30"
  quiet_end: "01:30"

# CSS selectors for your club's portal. Replace the placeholders.
selectors:
  username: "#username"
  password: "#password"
  login_button: "button[type=submit]"
  # A selector that appears ONLY when truly logged in (e.g. an account/profile
  # button) — used to confirm login. Avoid anything that also shows when logged
  # out (a tee-sheet date header often does), or login can false-positive.
  login_success_marker: ".member-dashboard, .logout"

  # On the tee sheet, the row/cell representing a bookable slot. The booker
  # finds the one whose visible text contains a preferred time.
  # The sheet's OWN date header. Checked against the requested play date before
  # any booking: on 2026-09-30 a failed reopen left the browser on the portal's
  # default (that day's) sheet and the race bought the WRONG DAY. Unreadable or
  # mismatched = no booking.
  sheet_date_label: "[data-testid=\"teetimes-header-date\"]"
  time_slot: ".teetime-slot, [data-time]"
  # The element that holds the slot's time text (relative to time_slot, or a
  # global selector). Used to match against preferred_times.
  time_slot_label: ".slot-time"
  # The button/link to start booking a given slot (inside time_slot).
  book_button: "button.book, a.book-now"
  # Optional: a per-slot label of allowed party sizes (e.g. "1", "1 or 2",
  # "2 - 4"). If set, slots that can't fit booking.players are skipped.
  slot_players_label: ""

  # --- Single-click portals -------------------------------------------------
  # If your portal books in one confirm click, set these two and leave the
  # cart-flow selectors below blank.
  # The final confirmation button on the booking dialog/page.
  confirm_button: "button.confirm, button[type=submit]"
  # A selector that appears once the booking is confirmed.
  confirmation_marker: ".booking-confirmed, .confirmation-number"

  # --- Cart-based portals (e.g. TeeItUp) ------------------------------------
  # If add_to_cart_button is set, the booker uses a multi-step checkout:
  #   book → choose golfers → add to cart → checkout → agree terms → purchase.
  # Leave these blank for single-click portals (use confirm_button above).
  #
  # Radio/button to pick the group size. {players} is replaced by
  # booking.players (so "...radio-2" selects a twosome).
  golfer_radio: ""
  # Optional: button to (re)select the highlighted rate, if required.
  rate_select_button: ""
  add_to_cart_button: ""
  # Optional safety: a selector that matches one element PER item in the cart.
  # If set and the cart ever holds more than one item at checkout, the booker
  # aborts instead of booking several at once.
  cart_item: ""
  # Optional: if a preferred time is taken by someone else mid-checkout, the
  # booker tries the next preferred time. To do that cleanly it first clears the
  # cart of the now-unavailable item. The kebab + delete controls live inside the
  # cart drawer, so recovery needs ALL THREE of: `cart_open_button` (header cart
  # icon that opens the drawer), `cart_item` (per-item kebab), and
  # `cart_item_remove` (the kebab menu's remove/delete item). Leave any blank to
  # skip cart-clearing — the >1-item guard above still prevents any over-booking.
  cart_open_button: ""
  cart_item_remove: ""
  # Button to start checkout from the cart drawer/page.
  cart_checkout_button: ""
  # The "I agree to the terms" checkbox on the checkout page.
  terms_checkbox: ""
  # The final button that places the order.
  complete_purchase_button: ""

# Cart-checkout behavior — only used when the cart-flow selectors above are set.
checkout:
  # The booking is considered successful once the page URL no longer contains
  # this substring (the portal navigates to a confirmation page on success).
  success_when_url_leaves: "/checkout"
  success_timeout_seconds: 20
  # If the portal says it is STILL PROCESSING a submitted purchase, keep waiting
  # this long instead of walking away at success_timeout_seconds. From
  # 2026-09-23 every night died at 20s with "Processing cart items ( 0 of 1 )"
  # still on screen, booking nothing for six nights running.
  processing_timeout_seconds: 180

# Optional date picker config — only needed if tee_sheet_url has no {date}.
date_picker:
  enabled: false
  open_button: ""     # opens the calendar
  day_cell: ""        # a day cell; {day} is substituted with the day number

runtime:
  # KEEP THIS false. Since 2026-09-23 the PCC portal stalls a HEADLESS browser
  # forever at the final purchase ("Processing cart items ( 0 of 1 )") — six
  # nights in a row booked nothing. A visible browser books in ~4s. A visible
  # window needs an active GUI login session (a locked screen is fine).
  headless: false
  screenshot_on_error: true
  screenshot_dir: "screenshots"
  # Slow down actions by N ms (helpful while debugging selectors).
  slow_mo_ms: 0
